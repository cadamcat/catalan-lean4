    id: "doi:10.1515/crll.2004.048"
    type: "paper"
    location: "J. reine angew. Math. 572 (2004), 167–195; the main theorem"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
  - title: "Catalan's conjecture (after Mihăilescu)"
    authors: ["Yuri F. Bilu"]
    id: "Séminaire Bourbaki, vol. 2002/2003, Astérisque 294 (2004), 1–26"
    type: "paper"
    location: "the cyclotomic proof as a whole"
    relationship: "formalizes"
    note: "The formal proof follows the route of this exposition and of Bilu (2005)."
    author_endorsement: "not-contacted"
  - title: "Catalan without logarithmic forms (after Bugeaud, Hanrot and Mihăilescu)"
    authors: ["Yuri F. Bilu"]
    id: "doi:10.5802/jtnb.478"
    type: "paper"
    location: "J. Théor. Nombres Bordeaux 17 (2005), 69–85; the bound on q and the final case analysis"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
  - title: "A class number free criterion for Catalan's conjecture"
    authors: ["Preda Mihăilescu"]
    id: "doi:10.1016/S0022-314X(02)00101-4"
    type: "paper"
    location: "J. Number Theory 99 (2003), 225–231; the double Wieferich criterion"
    relationship: "formalizes"
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/google-deepmind/formal-conjectures/blob/main/FormalConjectures/Wikipedia/Catalan.lean"
    relationship: "other"
    note: >-
      Formal Conjectures states Catalan.catalans_conjecture with the same
      statement as PalomarCatalan.catalans_conjecture in Challenge.lean. Since
      PR #6452 (merged 2026-09-22) it links release v1.0.0 of this repository
      as the formal proof.
  - id: "https://github.com/n-yamaguchi-0729/ClassFieldTheory"
    relationship: "builds-on"
    note: >-
      871 source files of this library are vendored under
      vendor/ClassFieldTheory. They come from commit 2930b56 and are adapted
      from the upstream port commit 7713795 to Lean v4.35.0-rc3 and Lean's
      module system. The modifications are recorded per file and checked by
      scripts/check_vendor.py; see THIRD_PARTY.md.
  - id: "https://github.com/xroblot/SKW/tree/4db8676808a63d892a8f36ead11308ca8dd58520"
    relationship: "other"
    note: >-
      No SKW code is imported. Two of its arguments are credited in source
      comments in Catalan/Stickelberger.
  - id: "https://github.com/Drag0ndddd1118/jsp-000035-formalization/tree/59837ccb2240f59c052603a0a550d62d6b9cac2e"
    relationship: "independent"
    note: >-
      It proves a bounded classification with bases and exponents between 2
      and 10. Its unrestricted classification invokes an explicit theorem
      axiom.
  - id: "https://github.com/zinan-huang/Ripple/tree/e9ce148d3975f9e75bb9724e01ec763ad9b368a9"
    relationship: "independent"
    note: >-
      It proves Cassels' divisibility q | x, for positive bases greater than 1
      and prime exponents at least 5, with related factorization, valuation
      and descent results. These are not the unrestricted theorem.
  - id: "doi:10.1145/3573105.3575682"
    relationship: "independent"
    note: >-
      Baanen, Best, Coppola and Dahmen, "Formalized class group computations
      and integral points on Mordell elliptic curves" (CPP 2023, Lean 3). It
      covers the cube–square special case y^2 = x^3 − 1.
  - id: "https://github.com/cadamcat/catalan-lean4/releases/tag/v1.0.0"
    relationship: "other"
    note: >-
      Release v1.0.0 (commit 4bf1f74) is the original release on Lean
      v4.33.1. This revision ports it to Lean v4.35.0-rc3 and the module
      system without changing any theorem statement.

