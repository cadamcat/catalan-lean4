# formalization.yaml (v0.4) for the Palomar Registry submission of this revision.
version: "v0.4"

project:
  name: "A Lean 4 formalization of Catalan's conjecture (Mihăilescu's theorem)"
  description: >-
    A complete Lean 4 formalization of Catalan's conjecture, proved by Preda
    Mihăilescu: 8 and 9 are the only consecutive positive proper perfect powers.
    The formal proof follows the cyclotomic proof in Yuri Bilu's expositions.
    Cassels' relations, Stickelberger annihilation, and height and counting
    estimates exclude the case in which one exponent is congruent to 1 modulo
    the other. Thaine's theorem on circular units, together with a Runge-type
    approximation argument, settles the remaining case. The
    class-field-theoretic input comes from a fixed, vendored subset of the
    ClassFieldTheory library. The registered results are four theorems:
    Catalan's conjecture over the natural numbers, in the form stated in
    Google DeepMind's Formal Conjectures; the same equation for integer bases
    greater than one; the classification of solutions of x^p − y^q = 1 with
    nonzero integer bases of either sign; and Mihăilescu's theorem that
    x^p = y^q + 1 has no solution in nonzero integers when p and q are odd
    primes. All four depend only on the axioms propext, Classical.choice and
    Quot.sound.
  authors:
    - "Yao Xu"
  responsible_maintainers:
    - "Yao Xu"
  license: "Apache-2.0"

