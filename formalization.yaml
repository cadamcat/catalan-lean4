automation:
  methods:
    - method: "agent"
      models: ["GPT-6 Pro", "GPT-6 Astra", "GPT-5.6 Luna", "Claude Fable 5.1", "Claude Opus 5", "GPT-6 Luna"]
      framework: "ChatGPT, Codex CLI and Claude Code"
      tool_setup: >-
        AI coding agents wrote the Lean code for release v1.0.0 (September
        2026) under acceptance criteria set by the author: the public results
        depend only on Lean's standard axioms, their whole dependency cone
        passes a kernel replay in a fresh environment, and the final theorems
        are accepted by an independent checker. Informal blueprints and draft
        Lean statements came from GPT-6 Pro sessions in ChatGPT and were
        treated as unverified input. After an audit, the author adopted the
        existing ClassFieldTheory library for the class-field-theoretic input
        instead of formalizing the needed class field theory within the
        project. The October 2026 port of this revision to Lean v4.35.0-rc3
        and the module system, a mechanical update with unchanged theorem
        statements, was done with the same agent workflow (GPT-6 Luna).
      cost:
        spend_usd: "subscription-based usage"
        hardware: "API-only models; local builds on an Apple Silicon Mac"
  spend_usd: "subscription-based usage"
  notes: >-
    The author is responsible for the content. Model agreement was not
    treated as verification; acceptance rests on the Lean kernel checks
    described under review.

fidelity:
  divergences: >-
    None in the four registered statements. Catalan's conjecture is stated
    over the natural numbers with truncated subtraction,
    x ^ a - y ^ b = 1, exactly as in Formal Conjectures; with this hypothesis
    the equation forces x ^ a = y ^ b + 1. The consecutive-powers form
    Catalan.JSP.statement is proved but not registered here.

review:
  status: "agent-reviewed"
  reviewers: []
  notes: >-
    This revision passed a full build, an axiom audit of all public results
    (only propext, Classical.choice and Quot.sound), a kernel replay of the
    complete dependency cone (131,214 constants) in a fresh environment, and
    Comparator with both the NanoDa kernel and Lean's default kernel. The
    accompanying paper and its correspondence to the Lean declarations
    received blind AI referee reviews and an AI fact check. No independent
    human expert has reviewed the formalization. Details are in
    Verification/RESULTS.md and docs/verification.md.

alignment:
  namespace: "Catalan"
  statements:
    - source: "Mihăilescu (2004), main theorem (Catalan's conjecture)"
      lean: "Catalan.catalans_conjecture"
      module: "Catalan/Final/Assembly.lean"
      status: "proved"
    - source: "Catalan's equation for integer bases greater than one"
      lean: "Catalan.catalan_int"
      module: "Catalan/Final/Assembly.lean"
      status: "proved"
    - source: "Classification of x^p − y^q = 1 for nonzero integers of either sign"
      lean: "Catalan.catalan_int_signed"
      module: "Catalan/Final/Signed.lean"
      status: "proved"
    - source: "Mihăilescu's theorem for odd prime exponents"
      lean: "Catalan.mihailescu_odd_primes"
      module: "Catalan/Final/Assembly.lean"
      status: "proved"

acknowledgements: >-
  Mathlib and the ClassFieldTheory library supply the underlying theories;
  their authors and licenses are credited in THIRD_PARTY.md. Comparator,
  lean4export and NanoDa were used for verification.
