    Complete formalization of Catalan's conjecture, together with the
    integer, signed-integer and odd-prime forms registered here. The project
    also proves Catalan.JSP.statement, a consecutive-powers form that uses a
    project definition of proper perfect powers. It is verified with the
    project but not included in the Comparator configuration.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "Catalan.catalans_conjecture"
      file: "Catalan/Final/Assembly.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "Catalan.catalan_int"
      file: "Catalan/Final/Assembly.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "Catalan.catalan_int_signed"
      file: "Catalan/Final/Signed.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "Catalan.mihailescu_odd_primes"
      file: "Catalan/Final/Assembly.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
